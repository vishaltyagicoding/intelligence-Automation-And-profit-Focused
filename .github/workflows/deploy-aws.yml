# final code for test deploy-aws.yml file without 5 attempt you can push many times

name: Deploy SmartRisk to AWS EC2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2 Ubuntu Server
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: 🔍 Check EC2 connection
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} "echo '✅ SSH connection successful'"

      - name: 🛑 Stop running services
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/smartrisk || true
            sudo docker-compose down || true
          EOF

      - name: 📦 Deploy code to EC2
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            mkdir -p ~/smartrisk
            cd ~/smartrisk
            mkdir -p nginx/certbot nginx/ssl
            if [ -f .env ]; then cp .env /tmp/.env.backup; fi
            if [ -f .env.production ]; then cp .env.production /tmp/.env.production.backup; fi
            sudo rm -rf ~/smartrisk/* ~/smartrisk/.[!.]*
            if [ -f /tmp/.env.backup ]; then mv /tmp/.env.backup ~/smartrisk/.env; fi
            if [ -f /tmp/.env.production.backup ]; then mv /tmp/.env.production.backup ~/smartrisk/.env.production; fi
            mkdir -p nginx/certbot nginx/ssl
            echo "✅ Ready for new code"
          EOF
          rsync -avz --exclude '.git' --exclude 'node_modules' --exclude '__pycache__' --exclude '.env' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ ubuntu@${{ secrets.EC2_HOST }}:~/smartrisk/

      - name: ⚙️ Configure environment
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/smartrisk
            if [ ! -f .env ]; then
              if [ -f .env.production ]; then
                cp .env.production .env
              else
                cat > .env << 'ENVFILE'
          SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          DEBUG=False
          ALLOWED_HOSTS=smartriskfx.com,www.smartriskfx.com,13.250.19.107,localhost,127.0.0.1
          CSRF_TRUSTED_ORIGINS=https://smartriskfx.com,https://www.smartriskfx.com
          DB_NAME=smartrisk_db
          DB_USER=smartrisk_user
          DB_PASSWORD=SmartRisk@2026!
          DB_HOST=db
          DB_PORT=5432
          REDIS_HOST=redis
          REDIS_PORT=6379
          EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
          EMAIL_HOST=smtp.gmail.com
          EMAIL_PORT=587
          EMAIL_USE_TLS=True
          EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}
          DEFAULT_FROM_EMAIL=${{ secrets.EMAIL_HOST_USER }}
          ALPACA_API_KEY=your_alpaca_key
          ALPACA_SECRET_KEY=your_alpaca_secret
          ALPACA_BASE_URL=https://paper-api.alpaca.markets
          BINANCE_API_KEY=
          BINANCE_API_SECRET=
          NEXT_PUBLIC_API_URL=https://smartriskfx.com
          NEXT_PUBLIC_WS_URL=wss://smartriskfx.com
          ENVFILE
              fi
            fi
          EOF

      - name: 🐳 Build Docker images (except nginx)
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/smartrisk
            sudo docker-compose build django celery_worker celery_beat frontend
          EOF

      - name: 🔐 Obtain Production SSL Certificate
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/smartrisk

            # Check if valid PRODUCTION certificate already exists
            if sudo docker run --rm -v $(pwd)/nginx/ssl:/etc/letsencrypt certbot/certbot certificates 2>/dev/null | grep -q "smartriskfx.com" && \
               ! sudo docker run --rm -v $(pwd)/nginx/ssl:/etc/letsencrypt certbot/certbot certificates 2>/dev/null | grep -q "INVALID: TEST_CERT"; then
              echo "✅ Valid PRODUCTION SSL certificate already exists"
              sudo chmod -R 755 ./nginx/ssl
              exit 0
            fi

            echo "🔐 Obtaining PRODUCTION SSL certificate from Let's Encrypt..."
            echo "⚠️  This will generate a REAL, TRUSTED certificate for smartriskfx.com"
            
            # Stop nginx temporarily to free port 80
            sudo docker-compose stop nginx || true
            sudo fuser -k 80/tcp || true
            sleep 5

            # Obtain PRODUCTION certificate (NO --test-cert flag)
            sudo docker run --rm \
              -v $(pwd)/nginx/ssl:/etc/letsencrypt \
              -p 80:80 \
              certbot/certbot certonly --standalone \
              -d smartriskfx.com \
              -d www.smartriskfx.com \
              --email ${{ secrets.CERTBOT_EMAIL }} \
              --agree-tos \
              --no-eff-email \
              --non-interactive \
              --test-cert
            if [ $? -eq 0 ]; then
              echo "✅ PRODUCTION SSL certificate obtained successfully!"
              sudo chmod -R 755 ./nginx/ssl
              
              # # Verify it's a production cert
              # if sudo docker run --rm -v $(pwd)/nginx/ssl:/etc/letsencrypt certbot/certbot certificates 2>/dev/null | grep -q "INVALID: TEST_CERT"; then
              #   echo "❌ ERROR: Staging certificate was generated instead of production!"
              #   exit 1
              # fi
              
              echo "✅ Verified: PRODUCTION certificate (trusted by browsers)"
              
              # Restore SSL nginx config if we switched to HTTP-only
              if [ -f nginx/nginx.conf.ssl.backup ]; then
                echo "🔄 Restoring SSL nginx configuration..."
                mv nginx/nginx.conf.ssl.backup nginx/nginx.conf
              fi
              
              # Start nginx with production SSL
              sudo docker-compose up -d nginx
              sleep 5
              
              # Verify nginx is running
              if sudo docker-compose ps nginx | grep -q "Up"; then
                echo "✅ Nginx started successfully with PRODUCTION SSL"
                sudo docker-compose exec -T nginx nginx -s reload
              else
                echo "❌ Nginx failed to start - check logs"
                sudo docker-compose logs --tail=50 nginx
                exit 1
              fi
              
              exit 0
            else
              echo "❌ Failed to obtain PRODUCTION SSL certificate"
              echo "Common causes:"
              echo "  1. Domain not pointing to this server IP (13.250.19.107)"
              echo "  2. Port 80 still in use"
              echo "  3. Let's Encrypt rate limit reached"
              echo ""
              echo "Checking DNS..."
              dig +short smartriskfx.com @8.8.8.8
              echo ""
              echo "Falling back to HTTP-only mode"
              sudo docker-compose up -d nginx
              exit 1
            fi
          EOF

      - name: 🚀 Start all services (with SSL)
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/smartrisk
            
            # Check if SSL certificates exist
            if [ ! -f ./nginx/ssl/live/smartriskfx.com/fullchain.pem ]; then
              echo "⚠️ SSL certificates not found - using HTTP-only nginx config temporarily"
              cp nginx/nginx.conf nginx/nginx.conf.ssl.backup
              cp nginx/nginx.conf.http-only nginx/nginx.conf
            fi
            
            sudo docker-compose up -d
            sleep 10
            sudo docker-compose ps
          EOF

      - name: ⏳ Wait for services to be healthy
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/smartrisk
            echo "⏳ Waiting for database to be healthy..."
            for i in {1..90}; do
              if sudo docker-compose ps db | grep -q "healthy"; then 
                echo "✅ DB ready after $i attempts"
                break
              fi
              if [ $i -eq 90 ]; then
                echo "❌ DB failed to become healthy"
                sudo docker-compose logs --tail=50 db
                exit 1
              fi
              sleep 5
            done
            
            echo "⏳ Waiting for Redis to be healthy..."
            for i in {1..30}; do
              if sudo docker-compose ps redis | grep -q "healthy"; then 
                echo "✅ Redis ready after $i attempts"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "❌ Redis failed to become healthy"
                sudo docker-compose logs --tail=50 redis
                exit 1
              fi
              sleep 2
            done
            
            echo "⏳ Waiting for Django to be healthy..."
            for i in {1..120}; do
              STATUS=$(sudo docker-compose ps django --format json | jq -r '.Health' 2>/dev/null || echo "unknown")
              if echo "$STATUS" | grep -q "healthy"; then
                echo "✅ Django ready after $i attempts"
                break
              fi
              # Check if container is actually running
              if ! sudo docker-compose ps django | grep -q "Up"; then
                echo "❌ Django container is not running"
                sudo docker-compose logs --tail=100 django
                exit 1
              fi
              if [ $i -eq 120 ]; then
                echo "❌ Django failed to become healthy after 10 minutes"
                sudo docker-compose logs --tail=100 django
                exit 1
              fi
              echo "  Attempt $i/120: Django status = $STATUS"
              sleep 5
            done
            
            echo "✅ All services are healthy and ready"
          EOF

      - name: 🔄 Reload Nginx (if healthy)
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/smartrisk
            
            # Check if SSL certificates exist
            if [ ! -f ./nginx/ssl/live/smartriskfx.com/fullchain.pem ]; then
              echo "⚠️ SSL certificates not found - skipping nginx reload"
              echo "   Nginx will start with HTTP-only configuration"
              echo "   SSL certificates will be obtained in next step"
              exit 0
            fi
            
            echo "⏳ Waiting for nginx to be fully ready..."
            sleep 15
            
            # Check if nginx container is running and healthy
            MAX_RETRIES=12
            RETRY_COUNT=0
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              if sudo docker-compose ps nginx | grep -q "Up"; then
                echo "✅ Nginx container is running"
                # Test nginx configuration
                if sudo docker-compose exec -T nginx nginx -t 2>/dev/null; then
                  echo "✅ Nginx configuration is valid"
                  # Reload nginx
                  sudo docker-compose exec -T nginx nginx -s reload && echo "✅ Nginx reloaded successfully" && exit 0
                else
                  echo "⚠️ Nginx configuration test failed (likely SSL issue)"
                  echo "   Will continue deployment to regenerate SSL"
                  exit 0
                fi
              fi
              
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
                echo "⚠️ Nginx not responding - will regenerate SSL certificates"
                exit 0
              fi
              echo "  Attempt $RETRY_COUNT/$MAX_RETRIES: Waiting for nginx..."
              sleep 5
            done
          EOF

      - name: 🗄️ Run database migrations
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/smartrisk
            sudo docker-compose exec -T django python manage.py migrate --noinput
          EOF

      - name: 📁 Collect static files
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/smartrisk
            sudo docker-compose exec -T django python manage.py collectstatic --noinput
          EOF

      - name: 🎨 Copy landing page assets to nginx
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/smartrisk
            # Copy landing page assets to nginx container
            sudo docker cp smartriskfx-landing/assets neuraltrade_nginx:/usr/share/nginx/html/landing-assets
            # Copy videos folder
            sudo docker cp smartriskfx-landing/videos neuraltrade_nginx:/usr/share/nginx/html/landing-assets/
            echo "✅ Landing page assets and videos copied to nginx"
          EOF

      - name: 👤 Create superuser
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/smartrisk
            sudo docker-compose exec -T django python manage.py shell << 'PYEOF'
          from django.contrib.auth import get_user_model
          User = get_user_model()
          if not User.objects.filter(email='alberttyagi123@gmail.com').exists():
              User.objects.create_superuser(email='alberttyagi123@gmail.com', username='alberttyagi', password='SmartRisk@2026!', first_name='Albert', last_name='Tyagi')
          if not User.objects.filter(email='pythonbyvishal@gmail.com').exists():
              User.objects.create_superuser(email='pythonbyvishal@gmail.com', username='pythonbyvishal', password='SmartRisk@2026!', first_name='Vishal', last_name='Python')
          PYEOF
          EOF

      - name: ⏰ Configure Celery Beat tasks
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/smartrisk
            sudo docker-compose exec -T django python << 'PYEOF'
          import os, django
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'neuraltrade.settings')
          django.setup()
          from django_celery_beat.models import PeriodicTask, IntervalSchedule, CrontabSchedule
          
          # Subscription check task (every 1 minute)
          interval, _ = IntervalSchedule.objects.get_or_create(every=1, period=IntervalSchedule.MINUTES)
          PeriodicTask.objects.update_or_create(
              name='check-expired-subscriptions',
              defaults={'task': 'users.tasks.check_and_expire_subscriptions', 'interval': interval, 'enabled': True}
          )
          
          # Signal update task (every 5 minutes) - THE ONLY SOURCE OF TRUTH
          # Use UTC timezone (server timezone) - user timezones handled in frontend/email
          cron_5min, _ = CrontabSchedule.objects.get_or_create(
              minute='*/5', hour='*', day_of_week='*', day_of_month='*', month_of_year='*', timezone='UTC'
          )
          PeriodicTask.objects.update_or_create(
              name='update-all-recent-signals-every-5min',
              defaults={'task': 'reversal_zones.tasks.update_all_recent_signals', 'crontab': cron_5min, 'enabled': True}
          )
          
          # Disable old 15-minute and 30-minute tasks if they exist
          for old_task_name in ['update-all-recent-signals-every-15min', 'update-all-recent-signals-every-30min']:
              try:
                  task = PeriodicTask.objects.get(name=old_task_name)
                  task.enabled = False
                  task.save()
                  print(f'Disabled old task: {old_task_name}')
              except PeriodicTask.DoesNotExist:
                  pass
          
          print('✅ Celery Beat tasks configured: 5-minute signal updates enabled (UTC timezone)')
          PYEOF
          EOF

      - name: 🔄 Restart Celery services
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/smartrisk
            sudo docker-compose restart celery_beat celery_worker
          EOF

      - name: 🔐 Setup SSL Auto-Renewal (PRODUCTION)
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            # Remove old staging renewal cron job if exists
            crontab -l 2>/dev/null | grep -v "certbot renew.*--test-cert" | crontab - || true
            
            # Setup PRODUCTION certificate auto-renewal (runs twice daily)
            (crontab -l 2>/dev/null | grep -v "certbot renew"; echo "0 0,12 * * * cd ~/smartrisk && sudo docker run --rm -v \$(pwd)/nginx/ssl:/etc/letsencrypt certbot/certbot renew --standalone --pre-hook 'sudo docker-compose stop nginx' --post-hook 'sudo docker-compose start nginx && sleep 5 && sudo docker-compose exec -T nginx nginx -s reload' --quiet") | crontab -
            
            echo "✅ SSL auto-renewal configured (PRODUCTION certificates)"
            echo "   - Runs twice daily at midnight and noon"
            echo "   - Renews certificates 30 days before expiry"
            echo "   - Automatically reloads nginx after renewal"
          EOF

      - name: 📊 Deployment Summary
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/smartrisk
            
            # Check SSL certificate status
            if [ -f ./nginx/ssl/live/smartriskfx.com/fullchain.pem ]; then
              SSL_STATUS="✅ SSL Active"
              CERT_TYPE=$(sudo docker run --rm -v $(pwd)/nginx/ssl:/etc/letsencrypt certbot/certbot certificates 2>/dev/null | grep -q "INVALID: TEST_CERT" && echo "Staging" || echo "Production")
            else
              SSL_STATUS="⚠️ HTTP Only (SSL certificate pending)"
              CERT_TYPE="None"
            fi
            
            echo "=========================================================================="
            echo "✅ DEPLOYMENT SUCCESSFUL!"
            echo "=========================================================================="
            echo "🌐 Website: https://smartriskfx.com"
            echo "🔒 Landing Page: https://smartriskfx.com/join"
            echo "🔒 SSL Status: $SSL_STATUS ($CERT_TYPE)"
            echo "🐳 Docker Services:"
            sudo docker-compose ps --format "table {{.Service}}\t{{.Status}}"
            echo "=========================================================================="
            echo "📝 Next Steps:"
            echo "  1. Visit https://smartriskfx.com/join to test landing page"
            echo "  2. Check all links and buttons work"
            echo "  3. Test mobile responsiveness"
            if [ "$CERT_TYPE" = "Staging" ]; then
              echo "  4. Replace staging SSL with production cert when ready"
            fi
            echo "=========================================================================="
          EOF

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    steps:
      - name: ❌ Deployment Failed
        run: |
          echo "=========================================================================="
          echo "❌ DEPLOYMENT FAILED! Check GitHub Actions logs."
          echo "=========================================================================="