name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    name: Deploy SmartRisk to Production
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚀 Checkout Code
        uses: actions/checkout@v3
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-1
          
      - name: 🔑 Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
          
      - name: 📋 Check EC2 Connection
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} "echo '✅ SSH Connection Successful'"
          
      - name: 🛑 Stop Running Services
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/smartrisk || exit 0
            docker-compose down || true
          EOF
          
      - name: 📥 Deploy Code to EC2
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            # Create directory if not exists
            mkdir -p ~/smartrisk
            cd ~/smartrisk
            
            # Clone or pull latest code
            if [ -d ".git" ]; then
              echo "📥 Pulling latest changes..."
              git fetch origin
              git reset --hard origin/main || git reset --hard origin/master
              git clean -fd
            else
              echo "📥 Cloning repository..."
              cd ~
              rm -rf smartrisk
              git clone https://github.com/${{ github.repository }}.git smartrisk
              cd smartrisk
            fi
            
            echo "✅ Code deployed successfully"
          EOF
          
      - name: 🔧 Configure Environment
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/smartrisk
            
            # Create .env file if not exists
            if [ ! -f ".env" ]; then
              echo "📝 Creating .env file..."
              cat > .env << 'ENVFILE'
# Database Configuration
DB_NAME=neuraltrade
DB_USER=postgres
DB_PASSWORD=postgres123
DB_HOST=db
DB_PORT=5432

# Django Configuration
SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
DEBUG=False
ALLOWED_HOSTS=${{ secrets.EC2_HOST }},localhost,127.0.0.1

# Email Configuration (Gmail SMTP)
EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
EMAIL_HOST=smtp.gmail.com
EMAIL_PORT=587
EMAIL_USE_TLS=True
EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}
EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}
DEFAULT_FROM_EMAIL=${{ secrets.EMAIL_HOST_USER }}

# Redis Configuration
REDIS_URL=redis://redis:6379/1

# Celery Configuration
CELERY_BROKER_URL=redis://redis:6379/1
CELERY_RESULT_BACKEND=redis://redis:6379/1

# Security
SECURE_SSL_REDIRECT=False
SESSION_COOKIE_SECURE=False
CSRF_COOKIE_SECURE=False

# CORS
CORS_ALLOWED_ORIGINS=http://${{ secrets.EC2_HOST }},http://localhost:3000

# WebSocket
CHANNEL_LAYERS_BACKEND=channels_redis.core.RedisChannelLayer
CHANNEL_LAYERS_HOST=redis
CHANNEL_LAYERS_PORT=6379
ENVFILE
              echo "✅ .env file created"
            else
              echo "✅ .env file already exists"
            fi
          EOF
          
      - name: 🐳 Build Docker Images
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/smartrisk
            echo "🐳 Building Docker images..."
            docker-compose build --no-cache
            echo "✅ Docker images built"
          EOF
          
      - name: 🚀 Start Services
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/smartrisk
            echo "🚀 Starting services..."
            docker-compose up -d
            echo "✅ Services started"
          EOF
          
      - name: ⏳ Wait for Services
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/smartrisk
            echo "⏳ Waiting for services to be healthy..."
            sleep 30
            docker-compose ps
          EOF
          
      - name: 🗄️ Run Database Migrations
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/smartrisk
            echo "🗄️ Running migrations..."
            docker-compose exec -T django python manage.py migrate --noinput
            echo "✅ Migrations completed"
          EOF
          
      - name: 📊 Collect Static Files
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/smartrisk
            echo "📊 Collecting static files..."
            docker-compose exec -T django python manage.py collectstatic --noinput
            echo "✅ Static files collected"
          EOF
          
      - name: 👤 Create Superuser
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/smartrisk
            echo "👤 Creating superuser..."
            docker-compose exec -T django python manage.py shell << 'PYTHON'
from django.contrib.auth import get_user_model
User = get_user_model()
if not User.objects.filter(email='alberttyagi123@gmail.com').exists():
    user = User.objects.create_superuser(
        email='alberttyagi123@gmail.com',
        username='alberttyagi',
        password='SmartRisk@2026!',
        first_name='Albert',
        last_name='Tyagi'
    )
    print('✅ Superuser created')
else:
    print('✅ Superuser already exists')
PYTHON
          EOF
          
      - name: ⚙️ Configure Celery Beat Tasks
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/smartrisk
            echo "⚙️ Configuring Celery Beat tasks..."
            docker-compose exec -T django python << 'PYTHON'
import os, sys, django
os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'neuraltrade.settings')
django.setup()

from django_celery_beat.models import PeriodicTask, IntervalSchedule, CrontabSchedule

# 1. Trial expiration task (every 1 minute)
interval, _ = IntervalSchedule.objects.get_or_create(
    every=1,
    period=IntervalSchedule.MINUTES,
)

task, created = PeriodicTask.objects.update_or_create(
    name='check-expired-subscriptions',
    defaults={
        'task': 'users.tasks.check_and_expire_subscriptions',
        'interval': interval,
        'enabled': True,
    }
)

print('✅ Trial expiration task configured (every 1 minute)')

# 2. Signal update task (every 15 minutes)
try:
    signal_task = PeriodicTask.objects.get(name='update-all-recent-signals-every-30min')
    cron, _ = CrontabSchedule.objects.get_or_create(
        minute='*/15',
        hour='*',
        day_of_week='*',
        day_of_month='*',
        month_of_year='*',
        timezone='Asia/Kolkata'
    )
    signal_task.crontab = cron
    signal_task.save()
    print('✅ Signal update task configured (every 15 minutes)')
except:
    print('⚠️  Signal update task will be created on first run')
PYTHON
          EOF
          
      - name: 🔄 Restart Services
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/smartrisk
            echo "🔄 Restarting services..."
            docker-compose restart celery_beat celery_worker
            echo "✅ Services restarted"
          EOF
          
      - name: 🧪 Health Check
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/smartrisk
            echo "🧪 Running health checks..."
            
            # Check Django health
            HEALTH=$(docker-compose exec -T django curl -s http://localhost:8000/health/ || echo "failed")
            if echo "$HEALTH" | grep -q "healthy"; then
              echo "✅ Django is healthy"
            else
              echo "❌ Django health check failed"
              exit 1
            fi
            
            # Check Redis
            REDIS=$(docker-compose exec -T redis redis-cli ping || echo "failed")
            if echo "$REDIS" | grep -q "PONG"; then
              echo "✅ Redis is healthy"
            else
              echo "❌ Redis health check failed"
              exit 1
            fi
            
            # Check services
            docker-compose ps
            
            echo "✅ All health checks passed"
          EOF
          
      - name: 📝 Deployment Summary
        run: |
          echo "=========================================================================="
          echo "🎉 DEPLOYMENT SUCCESSFUL!"
          echo "=========================================================================="
          echo ""
          echo "🌐 Application URLs:"
          echo "   Frontend: http://${{ secrets.EC2_HOST }}"
          echo "   API:      http://${{ secrets.EC2_HOST }}:8000"
          echo "   Admin:    http://${{ secrets.EC2_HOST }}:8000/admin/"
          echo ""
          echo "👤 Superuser Credentials:"
          echo "   Email:    alberttyagi123@gmail.com"
          echo "   Password: SmartRisk@2026!"
          echo ""
          echo "📊 Services:"
          echo "   ✅ PostgreSQL (TimescaleDB)"
          echo "   ✅ Redis"
          echo "   ✅ Django (Daphne ASGI)"
          echo "   ✅ Celery Worker"
          echo "   ✅ Celery Beat"
          echo "   ✅ Next.js Frontend"
          echo "   ✅ Nginx"
          echo ""
          echo "⚙️ Celery Tasks:"
          echo "   ✅ Trial expiration: Every 1 minute"
          echo "   ✅ Signal updates: Every 15 minutes"
          echo ""
          echo "=========================================================================="
          
      - name: 🔔 Notify on Failure
        if: failure()
        run: |
          echo "=========================================================================="
          echo "❌ DEPLOYMENT FAILED!"
          echo "=========================================================================="
          echo ""
          echo "Please check the logs above for error details."
          echo "Common issues:"
          echo "  - SSH connection failed"
          echo "  - Docker build failed"
          echo "  - Database migration failed"
          echo "  - Service health check failed"
          echo ""
          echo "=========================================================================="
