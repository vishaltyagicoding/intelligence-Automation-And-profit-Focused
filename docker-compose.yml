services:
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: neuraltrade_db
    environment:
      POSTGRES_DB: ${DB_NAME:-neuraltrade}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - neuraltrade_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: neuraltrade_redis
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - neuraltrade_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neuraltrade_django
    command: bash /app/scripts/start_server.sh
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - django_models:/app/models  # Persistent volume for models
      - django_logs:/app/logs      # Persistent volume for logs
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - neuraltrade_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neuraltrade_celery_worker
    command: celery -A neuraltrade worker -l info --concurrency=4
    volumes:
      - .:/app
      - ./models:/app/models
      - ./logs:/app/logs
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      django:
        condition: service_started
    networks:
      - neuraltrade_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A neuraltrade inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neuraltrade_celery_beat
    command: celery -A neuraltrade beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
      - ./models:/app/models
      - ./logs:/app/logs
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      django:
        condition: service_started
    networks:
      - neuraltrade_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A neuraltrade inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: neuraltrade_frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://54.183.178.141}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://54.183.178.141}
    networks:
      - neuraltrade_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: neuraltrade_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      django:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - neuraltrade_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  django_models:
  django_logs:

networks:
  neuraltrade_network:
    driver: bridge
