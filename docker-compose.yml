services:
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: neuraltrade_db
    environment:
      POSTGRES_DB: ${DB_NAME:-neuraltrade}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "work_mem=10MB"
      - "-c"
      - "maintenance_work_mem=128MB"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - neuraltrade_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-neuraltrade}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: neuraltrade_redis
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - neuraltrade_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neuraltrade_django
    command: bash /app/scripts/start_server.sh
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - django_models:/app/models
      - django_logs:/app/logs
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - neuraltrade_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neuraltrade_celery_worker
    command: celery -A neuraltrade worker -l info --concurrency=6 -Q celery,status_updates
    volumes:
      - .:/app
      - ./models:/app/models
      - ./logs:/app/logs
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      django:
        condition: service_started
    networks:
      - neuraltrade_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A neuraltrade inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── DEDICATED EMAIL WORKER ───────────────────────────────────────────────────
  # Separate container/process entirely from celery_worker (signal processing).
  # ROOT CAUSE FIX: even with a separate 'emails' queue on the same worker,
  # all 4-6 prefork child processes were shared with the high-volume
  # update_recent_signals_for_symbol_timeframe tasks (28 tasks/minute,
  # continuous ALTERNATION-blocked retries on 1d timeframe). Celery's prefetch
  # buffering meant 'emails' queue messages sat in the worker's internal
  # buffer behind dozens of signal tasks, sometimes for hours, and under
  # Redis memory pressure (allkeys-lru) could be evicted before consumption.
  #
  # A fully separate worker process with its own concurrency pool guarantees
  # email tasks are picked up within seconds, 100% of the time, no matter how
  # backlogged the main signal-processing worker becomes.
  celery_worker_emails:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neuraltrade_celery_worker_emails
    command: celery -A neuraltrade worker -l info --concurrency=2 -Q emails -n emails@%h
    volumes:
      - .:/app
      - ./models:/app/models
      - ./logs:/app/logs
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      django:
        condition: service_started
    networks:
      - neuraltrade_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A neuraltrade inspect ping -d emails@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neuraltrade_celery_beat
    # ⚠️  CRITICAL — DO NOT CHANGE THE --scheduler FLAG ⚠️
    # Must be celery.beat:PersistentScheduler so settings.py schedule is used.
    # DatabaseScheduler reads from DB and can have stale 30-min entries that
    # cause 40-minute signal email delays. PersistentScheduler always uses
    # CELERY_BEAT_SCHEDULE from settings.py — no DB overrides possible.
    # --schedule /tmp/ means fresh schedule on every restart (no stale file).
    command: celery -A neuraltrade beat -l info --scheduler celery.beat:PersistentScheduler --schedule /tmp/celerybeat-schedule
    volumes:
      - .:/app
      - ./models:/app/models
      - ./logs:/app/logs
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      django:
        condition: service_started
    networks:
      - neuraltrade_network
    restart: unless-stopped
    healthcheck:
      # Check that the beat heartbeat Redis key was updated in the last 3 minutes.
      # The update_all_recent_signals task writes this key on every run.
      # If this check fails, Docker will restart the celery_beat container.
      test: ["CMD-SHELL", "redis-cli -h $${REDIS_HOST:-redis} get beat:heartbeat:update_all_recent_signals | grep -qE '^[0-9]+$' || exit 1"]
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 180s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: neuraltrade_frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://smartriskfx.com
      - NEXT_PUBLIC_WS_URL=wss://smartriskfx.com
    networks:
      - neuraltrade_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: neuraltrade_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/letsencrypt:ro
      - ./nginx/certbot:/var/www/certbot
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      django:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - neuraltrade_network
    restart: unless-stopped

# Volume declarations – NO hyphens here
volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  django_models:
  django_logs:

networks:
  neuraltrade_network:
    driver: bridge