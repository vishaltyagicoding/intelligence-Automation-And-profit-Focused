[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:django]
command=/app/scripts/start_server.sh
directory=/app
autostart=true
autorestart=true
startretries=10
stderr_logfile=/var/log/supervisor/django.err.log
stdout_logfile=/var/log/supervisor/django.out.log
user=root
environment=PYTHONUNBUFFERED="1"

[program:celery_worker]
command=celery -A neuraltrade worker -l info --concurrency=4 -P eventlet
directory=/app
autostart=true
autorestart=true
startretries=10
stopwaitsecs=600
killasgroup=true
stderr_logfile=/var/log/supervisor/celery_worker.err.log
stdout_logfile=/var/log/supervisor/celery_worker.out.log
user=root
environment=PYTHONUNBUFFERED="1"

[program:celery_beat]
command=celery -A neuraltrade beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
directory=/app
autostart=true
autorestart=true
startretries=10
stderr_logfile=/var/log/supervisor/celery_beat.err.log
stdout_logfile=/var/log/supervisor/celery_beat.out.log
user=root
environment=PYTHONUNBUFFERED="1"

[program:kill_switch_monitor]
command=python manage.py monitor_kill_switch
directory=/app
autostart=true
autorestart=true
startretries=10
stderr_logfile=/var/log/supervisor/kill_switch.err.log
stdout_logfile=/var/log/supervisor/kill_switch.out.log
user=root
environment=PYTHONUNBUFFERED="1"

[group:neuraltrade]
programs=django,celery_worker,celery_beat,kill_switch_monitor
priority=999
